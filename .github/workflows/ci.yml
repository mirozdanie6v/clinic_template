name: Clinic template CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:client -- tests/fixtures/manual/passport.json
      - run: npm run validate:product
      - run: npm run validate:visual -- clients/evo/passport.json
      - run: npm run validate:visual -- clients/evo/passport.json --final
      - run: npm run build:client -- clients/evo/passport.json
      - run: npm run validate:product -- clients/evo/passport.json
      - run: npm run build
