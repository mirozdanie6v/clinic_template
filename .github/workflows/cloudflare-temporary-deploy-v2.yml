name: Cloudflare temporary deploy v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-temporary-deploy-v2.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Remove backend-only Wrangler config for Next.js autoconfig
        run: rm -f wrangler.jsonc
      - name: Deploy temporary Cloudflare Worker
        shell: bash
        run: |
          set -o pipefail
          npx wrangler@latest deploy --temporary 2>&1 | tee cloudflare-deploy.txt
      - name: Save deployment output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deploy-output-v2
          path: cloudflare-deploy.txt
          retention-days: 1
